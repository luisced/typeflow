name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/typeflow-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/typeflow-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_TYPEFLOW_API_URL=__TYPEFLOW_API_URL__
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_WEB }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker images

            ```
            ghcr.io/${{ github.repository_owner }}/typeflow-api:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/typeflow-web:${{ steps.version.outputs.version }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.

            Deploy with `./deploy.sh --pull` or `docker compose -f docker/docker-compose.prod.yml --env-file .env up -d`.
